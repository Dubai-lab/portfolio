name: Deploy

on:
  push:
    branches: [main]

# id-token lets the job ask GitHub for a short-lived login token that AWS trusts (OIDC).
permissions:
  id-token: write
  contents: read

# Never run two deployments at the same time.
concurrency: deploy

env:
  AWS_REGION: eu-north-1
  STACK_NAME: portfolio-crc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        run: |
          sam build
          sam deploy

      - name: Upload site and clear the CDN cache
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          aws s3 sync site/ "s3://$(output SiteBucketName)/" --delete
          aws cloudfront create-invalidation --distribution-id "$(output DistributionId)" --paths "/*"
