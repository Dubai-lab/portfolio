AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Portfolio site (Cloud Resume Challenge) - S3 + CloudFront hosting and visitor counter API

Resources:
  # Private bucket that stores the website files. Nobody can read it directly.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Origin Access Control: lets CloudFront sign its requests to the private bucket.
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The CDN in front of the bucket. Serves the site over HTTPS from edge locations.
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} portfolio site
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policies: CachingOptimized and SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # Only this one CloudFront distribution is allowed to read objects from the bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # Holds a single item: the visitor count. 1 read/1 write unit is inside the always-free tier.
  VisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # Public URL for the counter. Only the site's own addresses may call it from a browser.
  CounterApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${SiteDistribution.DomainName}
          - https://portfolio-pied-beta-46.vercel.app
        AllowMethods: [POST]
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  # Adds 1 to the count and returns the new total.
  CounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/counter/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      LoggingConfig:
        LogGroup: !Ref CounterLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt VisitsTable.Arn
      Events:
        CountVisit:
          Type: HttpApi
          Properties:
            ApiId: !Ref CounterApi
            Path: /visits
            Method: POST

  CounterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

Outputs:
  SiteBucketName:
    Description: Bucket the website files are uploaded to
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID (used to clear the cache)
    Value: !Ref SiteDistribution
  SiteUrl:
    Description: Public HTTPS address of the site
    Value: !Sub https://${SiteDistribution.DomainName}
  CounterApiUrl:
    Description: URL the site calls to count a visit (POST)
    Value: !Sub https://${CounterApi}.execute-api.${AWS::Region}.amazonaws.com/visits
